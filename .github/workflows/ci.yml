name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build, test, lint (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Private research must never be tracked
        shell: pwsh
        run: |
          $bad = git ls-files | Select-String -Pattern '^(research|shots|target)/'
          if ($bad) { $bad; throw 'private or generated files are tracked' }

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: The program starts and answers
        shell: pwsh
        run: |
          .\target\release\catalyx-cli.exe version
          .\target\release\catalyx-cli.exe help | Select-Object -First 3
          # the window front-end must be a window program (subsystem 2): starting it never opens a terminal
          $b = [IO.File]::ReadAllBytes("target\release\catalyx.exe"); $pe = [BitConverter]::ToInt32($b, 0x3c)
          $sub = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          if ($sub -ne 2) { throw "catalyx.exe has subsystem $sub; expected 2 (window)" }
