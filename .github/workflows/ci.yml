name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build, test, lint (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Private research must never be tracked
        shell: pwsh
        run: |
          $bad = git ls-files | Select-String -Pattern '^(research|shots|target)/'
          if ($bad) { $bad; throw 'private or generated files are tracked' }

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: The program starts and answers
        shell: pwsh
        run: |
          .\target\release\catalyx.exe version
          .\target\release\catalyx.exe help | Select-Object -First 3
