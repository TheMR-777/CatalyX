name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build catalyx.exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Checksum
        shell: pwsh
        run: |
          Copy-Item target\release\catalyx.exe catalyx.exe
          $h = (Get-FileHash catalyx.exe -Algorithm SHA256).Hash.ToLower()
          "$h  catalyx.exe" | Set-Content catalyx.exe.sha256 -Encoding ascii
          $h

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            catalyx.exe
            catalyx.exe.sha256
          generate_release_notes: true
