name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build catalyx.exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Checksums
        shell: pwsh
        run: |
          foreach ($n in 'catalyx', 'catalyx-cli') {
            Copy-Item "target\release\$n.exe" "$n.exe"
            $h = (Get-FileHash "$n.exe" -Algorithm SHA256).Hash.ToLower()
            "$h  $n.exe" | Set-Content "$n.exe.sha256" -Encoding ascii
            "$n.exe $h"
          }

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: |
            catalyx.exe
            catalyx.exe.sha256
            catalyx-cli.exe
            catalyx-cli.exe.sha256
          generate_release_notes: true
