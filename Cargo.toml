# One workspace, three packages: the core (no window at all), the classic skin (the window), and the
# program that picks a skin. `crates/catalyx-core` builds without egui; `skins/classic` is the only
# package that links it, so another skin is a new folder plus one line in `app/src/main.rs`.
# The version lives here once: every package inherits it, and `scripts/check.ps1` reads it from here.
[workspace]
resolver = "2"
members = ["crates/catalyx-core", "skins/classic", "app"]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TheMR-777/CatalyX"
homepage = "https://github.com/TheMR-777/CatalyX"
publish = false

[workspace.dependencies]
catalyx-core = { path = "crates/catalyx-core" }
catalyx-skin-classic = { path = "skins/classic" }
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.35"
egui-components = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "=0.30.13", default-features = false }
winreg = "0.52"
png = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
